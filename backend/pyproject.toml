[project]
name = "library-backend"
version = "0.1.0"
description = "Library application API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.115.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.3",
    "pytest>=9.1.1",
    "sqlalchemy>=2.0.52",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
